# Loca AI Leader Assistant — model routing (Section 17 + Phase 4 LOCAL_ONLY).
# `LLM_MODE` chọn block models tương ứng:
#   CLOUD_API   → `models` (Phase 1B default — gpt-4o family).
#   LOCAL_ONLY  → `models_local` (Phase 4 — qwen3 family qua Ollama).
#   HYBRID_SAFE → `models_hybrid` (Phase 2+ — main local, report cloud).

default_provider: openai
llm_mode: CLOUD_API
allow_cloud: true

providers:
  openai:
    type: openai
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"

  openrouter:
    type: openrouter
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"

  local_ollama:
    type: ollama
    base_url: "http://localhost:11434"

# Phase 1B / Phase 3 default — cloud OpenAI cho mọi task.
models:
  intent_classification:
    provider: openai
    name: "gpt-4o-mini"
  context_resolver:
    provider: openai
    name: "gpt-4o-mini"
  planner:
    provider: openai
    name: "gpt-4o-mini"
  answer_composer:
    provider: openai
    name: "gpt-4o"
  report_generator:
    provider: openai
    name: "gpt-4o"
  # Phase 5E — Query Plan Generator (Section 14.5: gpt-4o cho chất lượng JSON
  # plan + reasoning về whitelist columns/aggregates).
  plan_generator:
    provider: openai
    name: "gpt-4o"

# Phase 4 — LOCAL_ONLY: tất cả task chuyển Ollama. qwen3:14b cho main task,
# qwen3:8b cho task nhanh (intent) nếu đã pull. Nếu Ollama chưa
# có :8b, có thể đổi cả về :14b — yaml-only, không sửa code.
models_local:
  intent_classification:
    provider: local_ollama
    name: "qwen3:8b"
  context_resolver:
    provider: local_ollama
    name: "qwen3:8b"
  planner:
    provider: local_ollama
    name: "qwen3:14b"
  answer_composer:
    provider: local_ollama
    name: "qwen3:14b"
  report_generator:
    provider: local_ollama
    name: "qwen3:14b"
  plan_generator:
    provider: local_ollama
    name: "qwen3:14b"

# Phase 2+ HYBRID_SAFE — Section 10.1: data-sensitive task local, sinh báo cáo
# vẫn dùng cloud cho chất lượng cao. Tuỳ chính sách tổ chức.
models_hybrid:
  intent_classification:
    provider: local_ollama
    name: "qwen3:8b"
  context_resolver:
    provider: local_ollama
    name: "qwen3:8b"
  planner:
    provider: local_ollama
    name: "qwen3:14b"
  answer_composer:
    provider: local_ollama
    name: "qwen3:14b"
  report_generator:
    provider: openai
    name: "gpt-4o"
  # HYBRID_SAFE: plan generation đụng schema metadata không nhạy cảm dữ liệu
  # → để cloud cho chất lượng JSON plan tốt hơn (giống report_generator).
  plan_generator:
    provider: openai
    name: "gpt-4o"

fallback:
  enabled: true
  provider: openai
  name: "gpt-4o-mini"

fallback_local:
  enabled: true
  provider: local_ollama
  name: "qwen3:8b"

fallback_hybrid:
  enabled: true
  provider: local_ollama
  name: "qwen3:8b"
